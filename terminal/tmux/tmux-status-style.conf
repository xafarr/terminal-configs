######################
# Setup status style #
######################

default_fg="${thm_fg}"
default_bg="${thm_bg}"
tab_default_bg="${thm_surface_0}"
tab_default_fg="${thm_fg}"
right_separator=""
left_separator=""
inactive_right_separator="#[fg=${tab_default_bg},bg=default]${right_separator}#[default]"
inactive_left_separator="#[fg=$tab_default_bg]${left_separator}"
active_right_separator="#[reverse]${right_separator}#[default]"
active_left_separator="#[reverse]${left_separator}#[noreverse]"

# Uptime status
set -g @uptime '#(uptime | sed -E "s/.*up +//; s/(, +[0-9]+ users?)?, +load.*//; s/ days?, +/d /; s/([0-9]+):0?([0-9]+)/\1h \2m/; s/ hrs?/h/; s/ mins?/m/; s/ secs?/s/")'

set -g status-right 'up #{E:@uptime} | %H:%M'

# Remove vi style key bindings when in command mode
set -g status-keys emacs

# Style when text is selected in tmux in copy mode and
# when opening the tmux window selection
set -g mode-style "fg=$default_bg,bg=$thm_blue,bold"

# Command prompt style
set -g message-style "fg=$tab_default_fg,bg=$default_bg,fill=$default_bg"
set -g message-command-style "fg=$tab_default_fg,bg=$default_bg"

# Default color for whole status bar style
set -g status-style "fg=$tab_default_fg,bg=$thm_crust,nobold,nounderscore,noitalics"

# Default color for window status style
setw -g window-status-style "NONE,fg=$tab_default_fg,bg=$default_bg"
#setw -g window-status-activity-style "underscore,bold,fg=$default_bg,bg=$thm_peach"

# Default color for pane border style and active pane border style
set -g pane-border-style "fg=$tab_default_fg"
set -g pane-active-border-style "fg=$thm_peach"

# Right side status config
set -g status-right "#[fg=$thm_crust,bg=$thm_yellow]#{active_left_separator}󰔐 \
#[fg=$tab_default_fg,bg=$tab_default_bg] #{clima}#{inactive_right_separator} \
#[fg=$thm_crust, bg=$thm_green]#{active_left_separator}󰔟 \
#[fg=$tab_default_fg,bg=$tab_default_bg] #{E:@uptime}#{inactive_right_separator} \
#[fg=$thm_crust, bg=$thm_blue]#{active_left_separator}󰃰 \
#[fg=$tab_default_fg,bg=$tab_default_bg] %a %d-%b-%Y %I:%M %p#{inactive_right_separator} \
#[fg=$thm_crust, bg=$thm_mauve]#{active_left_separator}󰒍 \
#[fg=$tab_default_fg,bg=$tab_default_bg] #H#{inactive_right_separator}"

# Left side status config
set -g status-left "#[fg=$default_bg,bold]#{?client_prefix,#[bg=$thm_red],#[bg=$thm_green]}#{active_left_separator} #S#{active_right_separator} "

# Inactive and active window status format
setw -g window-status-format "#{inactive_left_separator}#[fg=$thm_overlay_1,bg=$tab_default_bg]#I │ #W#{inactive_right_separator}"
setw -g window-status-current-format "#[fg=$thm_crust,bg=$thm_yellow,bold]#{active_left_separator}#I │ #W#{?window_zoomed_flag,  ,}#{active_right_separator}"
